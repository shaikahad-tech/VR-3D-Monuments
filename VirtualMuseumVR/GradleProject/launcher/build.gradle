// launcher/build.gradle
// This is the Android app launcher module Unity exports.
// After Unity exports the Gradle project, this file is generated automatically.
// This version is pre-configured for Meta Quest.

apply plugin: 'com.android.application'

android {
    namespace 'com.virtualmuseum.vr'
    compileSdk 33

    defaultConfig {
        applicationId "com.virtualmuseum.vr"
        minSdk 29                // Meta Quest 2 minimum
        targetSdk 32
        versionCode = project.hasProperty('versionCode') ?
            project.property('versionCode').toInteger() : 1
        versionName = project.hasProperty('versionName') ?
            project.property('versionName') : "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'   // Quest requires ARM64 only
        }
    }

    // Signing configs — set via environment variables or local.properties
    signingConfigs {
        debug {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'debug.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('KEY_PASS') ?: 'android'
        }
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: ''
            keyPassword System.getenv('KEY_PASS') ?: ''
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            jniDebuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false    // Unity handles its own stripping
            shrinkResources false
        }
    }

    // Required for Unity IL2CPP builds
    packagingOptions {
        doNotStrip '*/arm64-v8a/*.so'
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':unityLibrary')
}
